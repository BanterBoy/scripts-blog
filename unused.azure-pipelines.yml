# Jekyll site
# Build the Jekyll site with the GitHub Pages gem on Ubuntu agents.
# Add steps that build, test, save build artifacts, deploy, and more:
# https://aka.ms/yaml

trigger:
- prod

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UseRubyVersion@0
  displayName: 'Select Ruby version'
  inputs:
    versionSpec: '>= 3.1'
    addToPath: true

- script: |
    if [ -f Gemfile.lock ]; then
      echo 'Gemfile.lock already present. Using existing lockfile for cache key.'
    else
      echo 'Gemfile.lock not found – generating temporary lockfile for cache key.'
      if ! command -v bundle >/dev/null; then
        echo 'Installing Bundler to create lockfile.'
        gem install bundler
      fi
      bundle lock
    fi
  displayName: 'Ensure Gemfile.lock for cache key'

- task: Cache@2
  displayName: 'Cache Ruby gems'
  inputs:
    key: 'bundler | "$(Agent.OS)" | $(Build.SourcesDirectory)/Gemfile.lock'
    restoreKeys: |
      bundler | "$(Agent.OS)"
    path: '$(Build.SourcesDirectory)/vendor/bundle'
    cacheHitVar: BUNDLE_CACHE_RESTORED

- script: |
    if [ "$(BUNDLE_CACHE_RESTORED)" = "true" ]; then
      echo 'Using cached gems from vendor/bundle.'
    else
      echo 'Cache miss – installing gems fresh.'
    fi
    if ! command -v bundle >/dev/null; then
      echo 'Installing Bundler.'
      gem install bundler
    fi
    bundle config set --local path vendor/bundle
    bundle install --jobs 4 --retry 3
  displayName: 'Install Ruby gems'
  env:
    BUNDLE_CACHE_RESTORED: $(BUNDLE_CACHE_RESTORED)

- script: bundle exec jekyll build --future
  displayName: 'Build Jekyll site'

- script: ls -la _site
  displayName: 'List generated site contents'

- powershell: |
    $root = "$(Build.SourcesDirectory)/_site"
    if (-not (Test-Path $root)) { throw "_site not found" }
    $css = Get-ChildItem $root -Recurse -Include *.css | Sort-Object Length -Descending | Select-Object -First 1
    if (-not $css -or $css.Length -lt 1024) { throw "CSS missing or too small" }
    $name = $css.Name
    $html = Get-ChildItem $root -Recurse -Include *.html | Where-Object {
      Select-String -Path $_.FullName -Pattern ([regex]::Escape($name)), 'assets/main\.css' -Quiet
    } | Select-Object -First 1
    if (-not $html) { throw "No HTML references $name or assets/main.css" }
    Write-Host "✅ CSS present and referenced: $($css.FullName)"
  displayName: "Verify CSS referenced in _site"

- task: PublishBuildArtifacts@1
  displayName: 'Publish site artifact'
  inputs:
    PathtoPublish: '_site'
    ArtifactName: 'jekyll-site'
    publishLocation: 'Container'

