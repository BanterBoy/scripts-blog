name: Jekyll Build Validation

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --future

      - name: Verify generated CSS is referenced
        shell: pwsh
        run: ./build/Verify-CssLink.ps1 -SiteRoot "_site" -CssHint "hyde.css"

      - name: Check generated site links
        # Originally: lycheeverse/lychee-action@v1
        uses: lycheeverse/lychee-action@c2e2e2b6e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/_site"
            --config .lychee.toml
            _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: _site
