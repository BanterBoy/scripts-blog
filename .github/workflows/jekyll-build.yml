name: Jekyll Build Validation

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace --future

      - name: Compute site base URL
        id: compute_base
        run: |
          ruby <<'RUBY'
          require 'yaml'

          config = YAML.load_file('_config.yml') || {}
          site_url = config['url'].to_s.strip
          baseurl = config['baseurl'].to_s.strip

          if site_url.empty?
            warn '::error::Could not determine site url from _config.yml'
            exit 1
          end

          site_url = site_url.sub(%r{/\z}, '')

          baseurl = '' if baseurl.empty? || baseurl == '/'
          baseurl = "/#{baseurl}" unless baseurl.empty? || baseurl.start_with?('/')

          full_base = "#{site_url}#{baseurl}"

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |f|
            f.puts "site_url=#{site_url}"
            f.puts "site_baseurl=#{baseurl}"
            f.puts "full_base=#{full_base}"
          end

          puts "::notice::full_base=#{full_base}"
          RUBY

      - name: Verify generated CSS is referenced
        shell: pwsh
        run: ./build/Verify-CssLink.ps1 -SiteRoot "_site" -CssHint "hyde.css"


      - name: Link check with Lychee (sitemap)
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          output: lychee-report.json
          args: >-
            --no-progress
            --verbose
            --format json
            --config .lychee.toml
            --sitemap "${{ steps.compute_base.outputs.full_base }}/sitemap.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SEO guardrail checks
        run: |
          ruby build/seo-checks.rb --site ./_site --out ./seo-checks.json
        env:
          CI: "true"
          SEO_SOFT_FAIL_WARNINGS: "false"
          SEO_SITEMAP_OPTIONAL: "false"

      - name: Upload seo-checks.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-checks
          path: seo-checks.json

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.json

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: _site
