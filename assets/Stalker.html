<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Stalker Page</title>
    <style>
        .map-cell {
            padding: 20px 30px;
            vertical-align: top;
        }

        .map-iframe-container {
            position: relative;
            padding-bottom: 75%;
            height: 0;
            overflow: hidden;
        }

        .map-iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="map-cell">
                <div class="map-iframe-container">
                    <iframe loading="lazy" allowfullscreen
                        src="https://maps.google.com/maps?q=53+Im+Steinbr%C3%BCchel+M%C3%A4nnedorf+8708+CH&output=embed"></iframe>
                </div>
            </td>
            <td class="map-cell">
                <div class="map-iframe-container">
                    <iframe loading="lazy" allowfullscreen
                        src="https://maps.google.com/maps?q=Inchture%2C+Perth+PH14+9SH+GB&output=embed"></iframe>
                </div>
            </td>
            <td class="map-cell">
                <div class="map-iframe-container">
                    <iframe loading="lazy" allowfullscreen
                        src="https://maps.google.com/maps?q=63+Archer+Avenue%2C+Southend-On-Sea%2C+Essex%2C+SS2+4QU+GB&output=embed"></iframe>
                </div>
            </td>
        </tr>
    </table>
</body>

</html>
