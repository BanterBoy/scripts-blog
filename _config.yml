# Where things are stored
source: .
destination: ./_site
layouts_dir: _layouts
includes_dir: _includes
data_dir: _data

# Handling Reading
safe: false
keep_files: [".git", ".svn"]
encoding: UTF-8
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
include:
  - "_pages"
  - "_posts"
  - "docs"

exclude:
  - "_site"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"
  - ".bundle/"
  - "tmp/"
  - "_drafts"
  - "_sass"
  - "PowerShell/inProgress"
  - "PowerShell/scriptNotes"
  - "PowerShell/scriptAssets"
# Markdown Processing
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Permalinks
permalink: /:categories/:title/
paginate: 3

# Setup
title: "Maintenance Scripts"
tagline: "ITAdmin PowerShell Maintenance Scripts"
description: "A repository of PowerShell Scripts to automate a variety of IT related maintenance tasks."
lang: en-GB
default_robots: "index,follow"
default_social_image: /assets/images/powershell-banner.png
twitter_username: luke_leighs
baseurl: "/"
url: https://scripts.lukeleigh.com

author:
  name: "Luke Leigh"
  email: me@lukeleigh.com
  url: https://lukeleigh.com
  bio: "PowerShell automation specialist sharing maintenance scripts and tooling."
  image: /assets/images/hangout_profile_pic_circle.jpg

organization:
  name: "Maintenance Scripts"
  url: https://scripts.lukeleigh.com
  description: "PowerShell automation scripts, modules, and snippets maintained by Luke Leigh."
  logo: /assets/images/powershell-banner.png

linkedin_username: lukeleigh

search_url: "https://www.google.com/search?q=site%3Ascripts.lukeleigh.com+{search_term_string}"

seo:
  noindex_allowlist:
    - 404.html
    - assets/KarenHome.html
    - assets/LukeHome.html
    - assets/MarkHome.html

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-json-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

github: [metadata]
github_username: BanterBoy
repository: scripts-blog/BanterBoy.github.io

# Custom vars
version: 2.0

